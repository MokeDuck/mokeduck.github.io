  <body class="games-page" onpageshow="usersOnlineFunction(1)" onpagehide="usersOnlineFunction(-1)">

<main class="games">

  <header class="container games-header">
    <h1 class="games-title">Below is an absolutely undisputed unquestionable fact</h1>
  </header>

  <section class="container games-fact">
    <aside class="fact-card games-card">
      <p class="card-label">the official fact</p>
      <h2 title="this text is the same no matter which device views this page" id="displayText">Ducks are the best</h2>
      <div>
        <button class="btn btn-outline-dark me-2" onclick="duckFunction()">Ducks!</button>
        <button class="btn btn-outline-dark" onclick="ratFunction()">Rats!</button>
      </div>
    </aside>
    <div class="watchers">friends watching: <span id="usersOnline">__</span></div>
  </section>

  <section class="stage" aria-label="The quacking duck and the official fact">
    <div class="stage-grid">
      <div class="duck-col">
        <picture>
          <source srcset="Referenced_Media/PaintedDuck1.webp" type="image/webp">
          <img id="duck" class="duck" src="Referenced_Media/PaintedDuck1.png" alt="A painted white duck leaning in from the left edge of the screen" width="1112" height="1415">
        </picture>
      </div>

      <div class="bubble-col">
        <button type="button" class="bubble" id="bubble" onclick="quackFunction()" aria-label="Add a quack" title="Add a quack"><span class="bubble-text" id="button1">quack</span></button>
        <div class="bubble-actions">
          <button type="button" class="btn btn-outline-dark" id="resetBtn" onclick="resetQuackFunction()">reset</button>
          <span class="bubble-tip">click the bubble to quack</span>
        </div>
        <p class="bubble-hint" id="quackHint" hidden>The duck is out of breath. Press reset.</p>
      </div>

    </div>
  </section>

  <section class="container games-lower">
    <div class="ttt-card games-card">
      <p class="card-label">duck tac toe</p>
      <div class="ttt-board">
        <button class="buttonDuck" id="1a" onclick="_1aFunction()">-</button>
        <button class="buttonDuck" id="1b" onclick="_1bFunction()">-</button>
        <button class="buttonDuck" id="1c" onclick="_1cFunction()">-</button>
        <button class="buttonDuck" id="2a" onclick="_2aFunction()">-</button>
        <button class="buttonDuck" id="2b" onclick="_2bFunction()">-</button>
        <button class="buttonDuck" id="2c" onclick="_2cFunction()">-</button>
        <button class="buttonDuck" id="3a" onclick="_3aFunction()">-</button>
        <button class="buttonDuck" id="3b" onclick="_3bFunction()">-</button>
        <button class="buttonDuck" id="3c" onclick="_3cFunction()">-</button>
      </div>
    </div>
  </section>
</main>

	var displayVar = document.getElementById('displayText');
	var dbRef1 = firebase.database().ref().child('text');
	dbRef1.on('value', snap => displayVar.innerText = snap.val());
	
	// ---- The quacking duck: the shared text lives at /button1 and is shown in the speech bubble ----
	var MAX_QUACK_LENGTH = 1800;   // stops the shared text growing without limit
	var button1Var = document.getElementById('button1');   // the speech bubble
	var quackHint = document.getElementById('quackHint');
	var bubbleVar = document.getElementById('bubble');   // the bubble's outer box (animated)
	var duckVar = document.getElementById('duck');
	var firstQuackLoad = true;
	var dbRef2 = firebase.database().ref().child('button1');
	dbRef2.on('value', snap => {
		var text = String(snap.val() || "quack");
		var changed = button1Var.textContent !== text;
		button1Var.textContent = text;
		var full = text.length >= MAX_QUACK_LENGTH;
		bubbleVar.disabled = full;
		quackHint.hidden = !full;
		if (changed && !firstQuackLoad) {
			[bubbleVar, duckVar].forEach(el => {
				el.classList.remove('quacked');
				void el.offsetWidth;   // restart the animation
				el.classList.add('quacked');
			});
		}
		firstQuackLoad = false;
	});
	
	var usersOnlineVar = document.getElementById('usersOnline');
	var dbRef_usersOnline = firebase.database().ref().child('usersOnline');
	dbRef_usersOnline.on('value', snap => usersOnlineVar.innerText = snap.val());
	
	
	function usersOnlineFunction(comeOrGo) {
		firebase.database().ref().update({usersOnline: firebase.database.ServerValue.increment(comeOrGo)});
	}
	
	// These control each function of the TicTacToe board --------------------------------------------------------------------------------------------

		if (_1aVar.innerText == "--"){
		firebase.database().ref().update({_1a:"🦆"});

		}

	// End of the TicTacToe board ---------------------------------------------------------------------------------
	
		

function duckFunction() {
  firebase.database().ref().update({text: "Ducks are the best"});
}
function ratFunction() {
  firebase.database().ref().update({text: "Rats are the best"});
}
function quackFunction() {
  // A transaction makes simultaneous quacks from several visitors add up instead of overwriting each other.
  firebase.database().ref().child('button1').transaction(function (current) {
    current = current || "quack";
    if (current.length >= MAX_QUACK_LENGTH) { return; }   // returning nothing cancels the write
    return "quack " + current;
  });
}
function resetQuackFunction() {
  firebase.database().ref().update({button1: "quack"});
}
