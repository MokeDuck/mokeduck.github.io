<script>

function update() {

    var str = document.getElementById("input").value

    var res01 = str.replace(/ᚴ◊/g, "q");

    var res02 = res01.replace(/ᚴ❯/g, "x");

    var res03 = res02.replace(/ᚴ/g, "c");

    var res04 = res03.replace(/ᚫ/g, "d");
 
    var res05 = res04.replace(/ᚺ/g, "e");

    var res06 = res05.replace(/ᛩ/g, "f");

    var res07 = res06.replace(/ᚠ/g, "g");

    var res08 = res07.replace(/ᛣ/g, "h");

    var res09 = res08.replace(/ᛁ/g, "i");

    var res10 = res09.replace(/ᛕ/g, "j");

    var res11 = res10.replace(/ᛅ/g, "l");

    var res12 = res11.replace(/ᛒ/g, "m");

    var res13 = res12.replace(/ᛘ/g, "n");

    var res14 = res13.replace(/Λ/g, "o");

    var res15 = res14.replace(/ᚹ/g, "p");

    var res16 = res15.replace(/ᚢ/g, "a");

    var res17 = res16.replace(/ᛏ/g, "r");

    var res18 = res17.replace(/❯/g, "s");

    var res19 = res18.replace(/ᛚ/g, "t");

    var res20 = res19.replace(/ᛟ/g, "u");

    var res21 = res20.replace(/Я/g, "v");

    var res22 = res21.replace(/◊/g, "w");

    var res23 = res22.replace(/ᚱ/g, "b");

    var res24 = res23.replace(/ᛋ/g, "y");

    

    document.getElementById("output").innerHTML = res24 + " ";

}

</script>
